<div class="layout-container">
  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" [class.open]="sidebarOpen()" (click)="closeSidebar()"></div>

  <!-- Mobile Menu Button -->
  <button class="mobile-menu-btn" (click)="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <button class="sidebar-close-btn" (click)="closeSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="logo-name">
        <img
          src="/LogoBlancoFondoTransparenteSinNombre.png"
          alt="RestoAdmin Logo"
          class="logo-icon"
        />
        <span class="logo-text">RestoAdmin</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/pedidos" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"
          />
        </svg>
        Pedidos
      </a>
      <a routerLink="/cancelados" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"
          />
        </svg>
        Pedidos Cancelados
      </a>
      <a routerLink="/historial" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"
          />
        </svg>
        Historial
      </a>
      <a routerLink="/productos" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
        </svg>
        Productos
      </a>
      <a routerLink="/usuarios" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"
          />
        </svg>
        Usuarios
      </a>
    </nav>

    <!-- Settings / Ajustes Section -->
    <div class="settings-section">
      <button class="nav-link settings-toggle" (click)="toggleSettings()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
          />
        </svg>
        Ajustes
        <svg
          class="chevron-icon"
          [class.chevron-up]="settingsOpen()"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
        </svg>
      </button>

      <div class="settings-panel" [class.open]="settingsOpen()">
        <div class="theme-selector">
          <p class="settings-label">Tema</p>
          <div class="theme-options">
            <button
              class="theme-option"
              [class.active]="currentTheme() === 'light'"
              (click)="setTheme('light')"
              title="Tema claro"
            >
              <svg class="theme-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"
                />
              </svg>
              <span>Light</span>
            </button>
            <button
              class="theme-option"
              [class.active]="currentTheme() === 'dark'"
              (click)="setTheme('dark')"
              title="Tema oscuro"
            >
              <svg class="theme-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"
                />
              </svg>
              <span>Dark</span>
            </button>
          </div>
        </div>

        <div class="theme-selector">
          <p class="settings-label">Vistas Previas</p>
          <div class="theme-options">
            <button
              class="theme-option preview-toggle"
              [class.active]="previewEnabled()"
              (click)="togglePreview()"
              title="Activar/desactivar vistas previas"
            >
              <svg
                class="theme-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>{{ previewEnabled() ? 'Activadas' : 'Desactivadas' }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="brand-section">
        <div class="brand-logo">
          <span>EMSI FARMA</span>
        </div>
        <span class="brand-name">EMSI FARMA</span>
      </div>
      <div class="contact-section">
        <p class="font-medium">Contact Us:</p>
        <p>+53 555-5555</p>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main-area">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="brand-badge">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.58 1.58-2.08 3.73-1.38 5.27L3.5 19.99l1.41 1.41L12 14.41l7.07 7.07 1.41-1.41L13.41 13l1.47-1.47z"
            />
          </svg>
          <span class="brand-name">Rey sushi</span>
        </div>
      </div>

      <div class="header-right">
        <div class="user-section">
          <div class="user-info">
            <p class="user-name">{{ currentUser()?.fullName || 'Admin User' }}</p>
            <p class="user-role">{{ currentUser()?.role === 'operario' ? 'Operario' : 'Admin' }}</p>
          </div>
          <button (click)="logout()" class="logout-btn" title="Cerrar sesión">
            <svg class="logout-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
